# nginx site config for CouchDB + LiveSync reverse proxy
#
# Place at /etc/nginx/sites-available/couchdb and symlink to sites-enabled/
# Listen on 8443 (avoid 80/8080 which usually collide with other services)
# Requires: nginx 1.18+, TLS cert + key under /opt/couchdb/certs/

upstream couchdb_backend {
    server 127.0.0.1:5984;
    keepalive 32;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name YOUR_SERVER_IP_OR_DOMAIN;

    ssl_certificate     /opt/couchdb/certs/fullchain.pem;
    ssl_certificate_key /opt/couchdb/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # WebSocket upgrade — REQUIRED for Self-hosted LiveSync
    # LiveSync keeps the WS open for hours (long-poll replication)
    location / {
        proxy_pass http://couchdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;

        # LiveSync WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;        # 24h keepalive
        proxy_send_timeout 86400;
    }
}

# After editing:
#   nginx -t                                              # check syntax
#   ps aux | grep '[n]ginx: master'                       # find real master PID
#   kill -HUP <master-pid>                                # graceful reload
#
# If nginx was started outside systemd, `systemctl reload nginx` returns
# "inactive" and `nginx -s reload` says "/run/nginx.pid: No such file".
# Always use kill -HUP <pid> instead. See springboot-vue3-admin-bootstrap pitfall #26.