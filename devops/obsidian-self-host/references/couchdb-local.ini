# CouchDB local.ini for single-user self-host
#
# Mount this file to /opt/couchdb/etc/local.d/local.ini inside the container
# File MUST be readable by UID 5984 (CouchDB runs as couchdb user inside container):
#   chown 5984:5984 local.ini && chmod 644 local.ini
#
# Do NOT use COUCHDB_USER/COUCHDB_PASSWORD env vars alongside this file —
# they conflict with [admins] section.

[couchdb]
single_node = true
max_attachment_size = 104857600     # 100 MB — allow large attachments

[chttpd]
port = 5984
bind_address = 127.0.0.1            # only nginx talks to us, never public
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[cors]
origins = *                          # LiveSync clients connect from various IPs
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer

[admins]
# Replace <ADMIN_PASS> with output of: openssl rand -hex 16
admin = <ADMIN_PASS>

# Per-user account. Replace <USERNAME> and <USER_PASS>.
# Username and password must ALSO be registered via:
#   curl -X PUT -u admin:<ADMIN_PASS> \
#     http://127.0.0.1:5984/_users/org.couchdb.user:<USERNAME> \
#     -H 'Content-Type: application/json' \
#     -d '{"name":"<USERNAME>","password":"<USER_PASS>","roles":[],"type":"user"}'
[YOUR_USERNAME]
roles = []
password = <USER_PASS>

[log]
level = info                          # debug if you want verbose; info is fine

# DO NOT add [cluster] or [replicator] sections for single-node setup.
# CouchDB defaults N=3 replication which logs harmless warnings on first start.